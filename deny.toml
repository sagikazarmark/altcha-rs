[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The workspace's altcha patch (see Cargo.toml). Drop it with the patch.
allow-git = ["https://github.com/sagikazarmark/altcha-lib-rs"]
